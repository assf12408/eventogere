<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Gerenciador de Eventos Acadêmicos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h1>🎓 Gerenciador de Eventos</h1>
    <div class="stats">
        <div>Total: <span id="totalCount">0</span></div>
        <div>Próximos: <span id="upcomingCount">0</span></div>
        <div>Concluídos: <span id="completedCount">0</span></div>
    </div>
  </div>

    <button onclick="toggleDarkMode()">🌙 Alternar Tema</button>

  <div class="container">

    <h1>🎓 Gerenciador de Eventos Acadêmicos</h1>

    <div class="form-container">
      <button class="add-btn" onclick="openModal()">+ Adicionar Evento</button>

      <div id="modal" class="modal">
        <div class="modal-content">
          <h2>Adicionar Evento</h2>
          <span class="tag ${tagClass}">${event.category}</span>

          <input type="text" id="eventName" placeholder="Nome do evento">
          <input type="date" id="eventDate">
          <input type="text" id="eventLocation" placeholder="Local">

          <select id="eventCategory">
            <option value="Technical">Tecnologia</option>
            <option value="Cultural">Cultura</option>
            <option value="Sports">Esportes</option>
          </select>

          <button onclick="addEvent()">Salvar</button>
          <button onclick="closeModal()">Cancelar</button>
        </div>
      </div>
    </div>

    <input type="text" id="search" placeholder="🔍 Buscar evento..." onkeyup="searchEvent()">

    <select id="filterStatus" onchange="applyFilters()">
      <option value="all">Todos</option>
      <option value="upcoming">Próximos</option>
      <option value="completed">Concluídos</option>
    </select>

    <select id="filterCategory" onchange="applyFilters()">
      <option value="all">Todas as categorias</option>
      <option value="Technical">Tecnologia</option>
      <option value="Cultural">Cultura</option>
      <option value="Sports">Esportes</option>
    </select>

    <select onchange="sortEvents(this.value)">
      <option value="newest">Mais recentes</option>
      <option value="oldest">Mais antigos</option>
    </select>

    <div id="eventList"></div>

  </div>

  <div id="toast" class="toast"></div>

  <footer>
    <p>Desenvolvido por Aditya Singh | Bacharelado em Ciência da Computação</p>
  </footer>

  <div id="loader" class="loader"></div>

</body>
</html>

<script src="script.js"></script>
